<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' width='400' height='400'>
  <defs>
    <linearGradient id='bgGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#EFF6FF'/>
      <stop offset='100%' stop-color='#FFFFFF'/>
    </linearGradient>
    <linearGradient id='boxGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1D4ED8'/>
      <stop offset='100%' stop-color='#1E40AF'/>
    </linearGradient>
    <linearGradient id='foilGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#F8FAFC'/>
      <stop offset='50%' stop-color='#E2E8F0'/>
      <stop offset='100%' stop-color='#CBD5E1'/>
    </linearGradient>
    <filter id='shadow' x='-10%' y='-10%' width='125%' height='125%'>
      <feDropShadow dx='0' dy='8' stdDeviation='10' flood-color='#1E40AF' flood-opacity='0.16'/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width='400' height='400' rx='28' fill='url(#bgGrad)'/>
  <circle cx='340' cy='60' r='100' fill='#1D4ED8' opacity='0.05'/>
  <circle cx='60' cy='340' r='80' fill='#10B981' opacity='0.08'/>

  <!-- Primary Packaging Box (Background) -->
  <g filter='url(#shadow)'>
    <rect x='50' y='50' width='300' height='160' rx='18' fill='url(#boxGrad)' stroke='#1D4ED8' stroke-width='2'/>
    
    <!-- White Header Banner -->
    <path d='M 50 64 Q 50 50 68 50 L 332 50 Q 350 50 350 64 L 350 105 L 50 105 Z' fill='#FFFFFF'/>
    <text x='70' y='88' font-family='system-ui, -apple-system, sans-serif' font-size='24' font-weight='900' fill='#1D4ED8' letter-spacing='-0.5'>Vicks VapoRub</text>
    
    <!-- Rx / OTC Tag -->
    <rect x='250' y='65' width='80' height='24' rx='6' fill='#059669'/>
         <text x='290' y='81' font-family='system-ui, sans-serif' font-size='10' font-weight='800' fill='#FFFFFF' text-anchor='middle'>100% OTC</text>

    <!-- Product Subtitle -->
    <text x='70' y='132' font-family='system-ui, sans-serif' font-size='13' font-weight='700' fill='#FFFFFF'>Camphor + Menthol + Eucalyptus Oil</text>
    <text x='70' y='152' font-family='system-ui, sans-serif' font-size='11' font-weight='600' fill='#F8FAFC' opacity='0.9'>Topical Ointment 25g • Cold & Flu</text>
    
    <!-- Manufacturer Seal -->
    <rect x='70' y='170' width='110' height='20' rx='5' fill='#FFFFFF' fill-opacity='0.2'/>
    <text x='125' y='184' font-family='system-ui, sans-serif' font-size='9' font-weight='800' fill='#FFFFFF' text-anchor='middle'>PROCTER & GAMBLE</text>
  </g>

  <!-- Dynamic Foreground Medicine Graphic -->
  
      <!-- Ointment Jar Foreground -->
      <g filter='url(#shadow)'>
        <!-- Jar Lid -->
        <ellipse cx='200' cy='200' rx='85' ry='22' fill='#10B981' stroke='#059669' stroke-width='2'/>
        <!-- Jar Body -->
        <path d='M 115 200 C 115 240, 118 290, 130 310 C 145 330, 255 330, 270 310 C 282 290, 285 240, 285 200 Z' fill='#1D4ED8' stroke='#1E3A8A' stroke-width='2'/>
        <!-- Jar Label -->
        <ellipse cx='200' cy='260' rx='65' ry='35' fill='#FFFFFF' stroke='#CBD5E1'/>
        <text x='200' y='255' font-family='system-ui, sans-serif' font-size='14' font-weight='900' fill='#1D4ED8' text-anchor='middle'>Vicks VapoRub</text>
        <text x='200' y='272' font-family='system-ui, sans-serif' font-size='8' font-weight='700' fill='#475569' text-anchor='middle'>VAPORIZING OINTMENT</text>
      </g>
    
</svg>